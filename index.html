<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NATO DEEP eAcademy | Fundamentals of Deep Learning</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">NATO DEEP eAcademy</div>
    <div class="lang" aria-label="Language">
      <button data-lang="uk" class="active">UA</button><button data-lang="en">EN</button>
    </div>
  </header>
  <div class="progress"><div id="progressBar"></div></div>
  <main id="course">
    <section class="hero">
      <p class="eyebrow" data-i18n="eyebrow">ІНТЕРАКТИВНИЙ НАВЧАЛЬНИЙ МОДУЛЬ</p>
      <h1 data-i18n="title">Основи глибокого навчання</h1>
      <p class="lead" data-i18n="subtitle">Від штучного нейрона до навчання нейронної мережі</p>
      <button id="startBtn" class="primary" data-i18n="start">Розпочати курс</button>
    </section>
    <section id="modules" class="modules hidden">
      <h2 data-i18n="courseMap">Структура курсу</h2>
      <div id="moduleGrid" class="grid"></div>
      <div class="nav">
        <button id="prevBtn" data-i18n="previous">Назад</button>
        <button id="nextBtn" class="primary" data-i18n="next">Далі</button>
      </div>
    </section>
  </main>
  <footer><span data-i18n="footer">Prototype for NATO DEEP eAcademy</span></footer>
  <script src="js/language.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
