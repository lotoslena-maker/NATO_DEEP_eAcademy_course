<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="28" fill="#0a2036"/>
<g font-family="Arial, sans-serif" fill="#eef5fb">
  <text x="60" y="58" font-size="30" font-weight="700">Neural network layers</text>
  <text x="60" y="92" font-size="18" fill="#afc2d6">Input values move through hidden layers before the network produces an output.</text>
</g>
<g stroke="#396b93" stroke-width="2" opacity=".8">
  <line x1="180" y1="180" x2="440" y2="145"/><line x1="180" y1="180" x2="440" y2="245"/><line x1="180" y1="180" x2="440" y2="345"/>
  <line x1="180" y1="270" x2="440" y2="145"/><line x1="180" y1="270" x2="440" y2="245"/><line x1="180" y1="270" x2="440" y2="345"/>
  <line x1="180" y1="360" x2="440" y2="145"/><line x1="180" y1="360" x2="440" y2="245"/><line x1="180" y1="360" x2="440" y2="345"/>
  <line x1="440" y1="145" x2="700" y2="160"/><line x1="440" y1="145" x2="700" y2="260"/><line x1="440" y1="145" x2="700" y2="360"/>
  <line x1="440" y1="245" x2="700" y2="160"/><line x1="440" y1="245" x2="700" y2="260"/><line x1="440" y1="245" x2="700" y2="360"/>
  <line x1="440" y1="345" x2="700" y2="160"/><line x1="440" y1="345" x2="700" y2="260"/><line x1="440" y1="345" x2="700" y2="360"/>
  <line x1="700" y1="160" x2="990" y2="215"/><line x1="700" y1="160" x2="990" y2="315"/>
  <line x1="700" y1="260" x2="990" y2="215"/><line x1="700" y1="260" x2="990" y2="315"/>
  <line x1="700" y1="360" x2="990" y2="215"/><line x1="700" y1="360" x2="990" y2="315"/>
</g>
<g stroke-width="3">
  <g fill="#143c5f" stroke="#6fc7ff"><circle cx="180" cy="180" r="28"/><circle cx="180" cy="270" r="28"/><circle cx="180" cy="360" r="28"/></g>
  <g fill="#372b69" stroke="#a892ff"><circle cx="440" cy="145" r="28"/><circle cx="440" cy="245" r="28"/><circle cx="440" cy="345" r="28"/></g>
  <g fill="#372b69" stroke="#a892ff"><circle cx="700" cy="160" r="28"/><circle cx="700" cy="260" r="28"/><circle cx="700" cy="360" r="28"/></g>
  <g fill="#164f40" stroke="#86e3b2"><circle cx="990" cy="215" r="30"/><circle cx="990" cy="315" r="30"/></g>
</g>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <text x="180" y="450" fill="#6fc7ff" font-size="22" font-weight="700">Input layer</text>
  <text x="570" y="450" fill="#a892ff" font-size="22" font-weight="700">Hidden layers</text>
  <text x="990" y="450" fill="#86e3b2" font-size="22" font-weight="700">Output layer</text>
</g>
</svg>