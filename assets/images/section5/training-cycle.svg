<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
<rect width="1200" height="360" rx="28" fill="#0a2036"/>
<g font-family="Arial, sans-serif">
  <text x="60" y="55" fill="#eef5fb" font-size="30" font-weight="700">Training loop</text>
  <text x="60" y="88" fill="#afc2d6" font-size="18">The network predicts, measures error, propagates it backward, and updates its weights.</text>
</g>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <g transform="translate(55 140)"><rect width="190" height="120" rx="18" fill="#102d48" stroke="#2e5879"/><text x="95" y="42" fill="#6fc7ff" font-size="20" font-weight="700">1. Data</text><text x="95" y="80" fill="#eef5fb" font-size="17">input batch</text></g>
  <text x="275" y="210" fill="#6fc7ff" font-size="38">→</text>
  <g transform="translate(310 140)"><rect width="190" height="120" rx="18" fill="#102d48" stroke="#2e5879"/><text x="95" y="42" fill="#6fc7ff" font-size="20" font-weight="700">2. Forward</text><text x="95" y="80" fill="#eef5fb" font-size="17">prediction</text></g>
  <text x="530" y="210" fill="#6fc7ff" font-size="38">→</text>
  <g transform="translate(565 140)"><rect width="190" height="120" rx="18" fill="#102d48" stroke="#2e5879"/><text x="95" y="42" fill="#ffd27a" font-size="20" font-weight="700">3. Loss</text><text x="95" y="80" fill="#eef5fb" font-size="17">measure error</text></g>
  <text x="785" y="210" fill="#6fc7ff" font-size="38">→</text>
  <g transform="translate(820 140)"><rect width="190" height="120" rx="18" fill="#102d48" stroke="#2e5879"/><text x="95" y="42" fill="#a892ff" font-size="20" font-weight="700">4. Backprop</text><text x="95" y="80" fill="#eef5fb" font-size="17">gradients</text></g>
  <text x="1040" y="210" fill="#6fc7ff" font-size="38">→</text>
  <g transform="translate(1065 140)"><rect width="100" height="120" rx="18" fill="#164f40" stroke="#86e3b2"/><text x="50" y="42" fill="#86e3b2" font-size="19" font-weight="700">5.</text><text x="50" y="72" fill="#eef5fb" font-size="15">update</text><text x="50" y="94" fill="#eef5fb" font-size="15">weights</text></g>
</g>
</svg>