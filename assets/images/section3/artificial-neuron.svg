<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#091b2d"/><stop offset="1" stop-color="#0d2b47"/></linearGradient>
  <linearGradient id="node" x1="0" x2="1"><stop stop-color="#1f77ff"/><stop offset="1" stop-color="#6fc7ff"/></linearGradient>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<g font-family="Arial, sans-serif" fill="#eef5fb">
  <text x="60" y="58" font-size="30" font-weight="700">Artificial neuron</text>
  <text x="60" y="92" font-size="18" fill="#afc2d6">Inputs are weighted, summed, shifted by bias, and transformed by an activation function.</text>
</g>
<g stroke="#6fc7ff" stroke-width="4" fill="none" opacity=".85">
  <line x1="185" y1="155" x2="430" y2="210"/>
  <line x1="185" y1="210" x2="430" y2="210"/>
  <line x1="185" y1="265" x2="430" y2="210"/>
  <line x1="550" y1="210" x2="725" y2="210"/>
  <line x1="855" y1="210" x2="1055" y2="210"/>
  <line x1="490" y1="125" x2="490" y2="160"/>
</g>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <g fill="#123c5e" stroke="#6fc7ff" stroke-width="3">
    <circle cx="150" cy="155" r="34"/><circle cx="150" cy="210" r="34"/><circle cx="150" cy="265" r="34"/>
    <circle cx="490" cy="210" r="62" fill="url(#node)"/>
    <rect x="725" y="155" width="130" height="110" rx="22"/>
    <circle cx="1090" cy="210" r="42"/>
    <circle cx="490" cy="92" r="28"/>
  </g>
  <g fill="#fff">
    <text x="150" y="163" font-size="24">x₁</text><text x="150" y="218" font-size="24">x₂</text><text x="150" y="273" font-size="24">x₃</text>
    <text x="490" y="222" font-size="52" font-weight="700">Σ</text>
    <text x="790" y="220" font-size="38" font-style="italic">f(z)</text>
    <text x="1090" y="219" font-size="28">ŷ</text>
    <text x="490" y="101" font-size="22">b</text>
  </g>
  <g fill="#afc2d6">
    <text x="150" y="325" font-size="18">inputs</text>
    <text x="340" y="176" font-size="18">weights w</text>
    <text x="490" y="300" font-size="18">weighted sum</text>
    <text x="790" y="300" font-size="18">activation</text>
    <text x="1090" y="278" font-size="18">output</text>
  </g>
</g>
</svg>